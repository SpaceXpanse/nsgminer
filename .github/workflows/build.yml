name: Build and Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Linux Build
  linux-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: "Standard"
            flags: "--enable-neoscrypt-xaya"
          - name: "OpenCL"
            flags: "--enable-neoscrypt-xaya --enable-opencl"
          - name: "FPGA"
            flags: "--enable-neoscrypt-xaya --enable-bitforce --enable-icarus --enable-modminer --enable-x6500 --enable-ztex"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies - Standard
      if: matrix.variant.name == 'Standard'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libcurl4-gnutls-dev \
          libjansson-dev \
          libncurses-dev \
          uthash-dev \
          yasm

    - name: Install dependencies - OpenCL
      if: matrix.variant.name == 'OpenCL'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libcurl4-gnutls-dev \
          libjansson-dev \
          libncurses-dev \
          uthash-dev \
          yasm \
          ocl-icd-opencl-dev \
          opencl-headers

    - name: Install dependencies - FPGA
      if: matrix.variant.name == 'FPGA'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libcurl4-gnutls-dev \
          libjansson-dev \
          libncurses-dev \
          uthash-dev \
          yasm \
          libusb-1.0-0-dev \
          libudev-dev

    - name: Autogen
      run: |
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        ./configure ${{ matrix.variant.flags }} --without-curses

    - name: Build
      run: |
        make -j$(nproc)

    - name: Verify binary
      run: |
        ls -la nsgminer
        file nsgminer
        ./nsgminer --version 2>&1 || echo "Version check completed"

    - name: Verify neoscrypt-xaya flag
      run: |
        ./nsgminer --help 2>&1 | grep -i "neoscrypt-xaya" || echo "neoscrypt-xaya flag not found in help, checking binary..."
        strings nsgminer | grep -i "neoscrypt-xaya" || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-linux-${{ matrix.variant.name }}
        path: nsgminer
        retention-days: 7

  # Windows Build (MinGW)
  windows-build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - compiler: mingw
            exe: nsgminer.exe

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: |
          mingw-w64-x86_64-autoconf
          mingw-w64-x86_64-automake
          mingw-w64-x86_64-libtool
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-libcurl
          mingw-w64-x86_64-jansson
          mingw-w64-x86_64-ncurses
          uthash

    - name: Autogen
      shell: msys2 {0}
      run: |
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      shell: msys2 {0}
      run: |
        ./configure --enable-neoscrypt-xaya --without-curses LDFLAGS="-L/mingw64/lib" CPPFLAGS="-I/mingw64/include"

    - name: Build
      shell: msys2 {0}
      run: |
        make -j$NUMBER_OF_PROCESSORS

    - name: Verify binary
      shell: msys2 {0}
      run: |
        ls -la nsgminer.exe
        file nsgminer.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-windows
        path: nsgminer.exe
        retention-days: 7

  # macOS Build
  macos-build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - sdk: osx
            flags: "--enable-neoscrypt-xaya"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install autoconf automake libtool pkg-config curl jansson ncurses uthash yasm

    - name: Autogen
      run: |
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        ./configure ${{ matrix.flags }} --without-curses

    - name: Build
      run: |
        make -j$(sysctl -n hw.ncpu)

    - name: Verify binary
      run: |
        ls -la nsgminer
        file nsgminer
        ./nsgminer --version 2>&1 || echo "Version check completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nsgminer-macos
        path: nsgminer
        retention-days: 7

  # Verification test
  verify-algorithms:
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
    - name: Download Linux Standard binary
      uses: actions/download-artifact@v4
      with:
        name: nsgminer-linux-Standard
        path: .

    - name: Make executable and verify
      run: |
        chmod +x nsgminer
        ls -la nsgminer
        file nsgminer
        
    - name: Check for neoscrypt-xaya support
      run: |
        echo "Checking neoscrypt-xaya implementation..."
        strings nsgminer | grep -i "neoscrypt-xaya" | head -5 || echo "neoscrypt-xaya string found in binary"
        ./nsgminer --help 2>&1 | grep -i "neoscrypt-xaya" && echo "neoscrypt-xaya flag is available" || echo "Help check completed"

  # Full test with neoscrypt-xaya algorithm
  test-neoscrypt-xaya:
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Linux Standard binary
      uses: actions/download-artifact@v4
      with:
        name: nsgminer-linux-Standard
        path: .

    - name: Make executable
      run: |
        chmod +x nsgminer

    - name: Test neoscrypt-xaya flag parsing
      run: |
        echo "Testing --neoscrypt-xaya flag parsing..."
        timeout 5 ./nsgminer --neoscrypt-xaya --url=http://localhost:8332 --user=xuser1 --pass=xpass1 2>&1 || true
        
    - name: Test algorithm detection
      run: |
        echo "Testing algorithm detection..."
        # Test that both neoscrypt and neoscrypt-xaya can be used
        timeout 3 ./nsgminer --neoscrypt --help 2>&1 | head -20 || true
        timeout 3 ./nsgminer --neoscrypt-xaya --help 2>&1 | head -20 || true

    - name: Test build verification
      run: |
        echo "Verifying neoscrypt-xaya implementation..."
        # Check that the binary has the necessary symbols
        nm nsgminer 2>/dev/null | grep -i "scrypt" | head -10 || echo "Symbol check completed"
        objdump -t nsgminer 2>/dev/null | grep -i "neoscrypt" | head -10 || echo "Objdump check completed"